[project]
name = "bench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
# The upper bound is for reproducibility, not necessity. TRex vendors old
# dependencies (scapy 2.4.3), so the benchmark runs it on an interpreter near
# what it was built against rather than on whatever the host happens to ship --
# a measurement tool should not change behaviour because the OS upgraded Python.
# Checked rather than assumed: TRex v3.08's ASTF client does import cleanly on
# 3.14 too, so dropping the bound is an option if you ever need it.
#
# Kept identical to the inline script metadata at the top of bench.py -- if the
# two disagree, uv resolves the script against one and your editor against the
# other.
requires-python = ">=3.11,<3.13"
dependencies = []
